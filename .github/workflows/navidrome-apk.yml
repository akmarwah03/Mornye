name: Navidrome streaming APK

on:
  push:
    branches: [build/navidrome-transcoding-apk]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navidrome-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MORNYE_DISCORD_SDK: "0"
      MORNYE_RUST_ANDROID_ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.2"
      - name: Prepare Flutter and dependencies
        run: |
          dart scripts/prepare_flutter_sdk.dart
          flutter pub get
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Test Subsonic streaming and downloads
        run: |
          dart format --output=none --set-exit-if-changed lib/services/network_storage_subsonic.dart test/subsonic_storage_test.dart test/support/subsonic_fixture.dart integration_test/subsonic_playback_test.dart
          flutter test test/subsonic_storage_test.dart test/link_subsonic_download_test.dart test/subsonic_download_backpressure_test.dart
      - name: Install Android and Rust build prerequisites
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "platforms;android-37.0" "build-tools;37.0.0" "cmake;4.1.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          cd rust_backend
          rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: navidrome-apk-${{ runner.os }}-${{ hashFiles('rust_backend/rust-toolchain.toml', 'rust_backend/Cargo.lock') }}
      - name: Give the test build a separate Android identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          assert 'applicationId = "com.zarz.mornye"' in text
          gradle.write_text(text.replace('applicationId = "com.zarz.mornye"', 'applicationId = "com.zarz.mornye.navidrome"'))
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          assert 'android:label="Mornye"' in text
          manifest.write_text(text.replace('android:label="Mornye"', 'android:label="Mornye (Navidrome)"'))
          PY
      - name: Build and verify signed arm64 APK
        run: |
          bash scripts/build_android.sh --lite --target lib/main.dart
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Mornye-Navidrome-arm64.apk
          sha256sum Mornye-Navidrome-arm64.apk > Mornye-Navidrome-arm64.apk.sha256
          git rev-parse HEAD > commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mornye-Navidrome-arm64
          if-no-files-found: error
          retention-days: 30
          path: |
            Mornye-Navidrome-arm64.apk
            Mornye-Navidrome-arm64.apk.sha256
            commit.txt
